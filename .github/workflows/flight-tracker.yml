name: Flight Price Tracker

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flight-price-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Persist price history
        run: |
          git config user.name "flight-price-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add flights.db
          if git diff --staged --quiet; then
            echo "Keine Aenderungen an flights.db"
            exit 0
          fi
          git commit -m "Update price history [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git merge -X ours --no-edit -m "Merge remote history [skip ci]" origin/main
            if git push origin HEAD:main; then
              break
            fi
            echo "Push fehlgeschlagen (Versuch $i), retry nach kurzer Pause..."
            sleep $((RANDOM % 10 + 1))
          done

      - name: Send digest (every 2 hours)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          HOUR=$(date -u +%H)
          if [ $((10#$HOUR % 2)) -eq 0 ]; then
            python digest.py
          else
            echo "Ungerade Stunde ($HOUR UTC) - Digest wird uebersprungen"
          fi
